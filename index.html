<meta name="theme-color" content="#0b3d91">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#ffffff;
font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1f1f1d}
.card{max-width:420px;padding:28px 20px;text-align:center}
img{width:220px;max-width:70vw;height:auto}
p{color:#52514e;margin:10px 0 22px}
.btn{display:block;width:100%;box-sizing:border-box;padding:14px 18px;margin:10px 0;border-radius:12px;
font-size:17px;font-weight:600;text-decoration:none;border:0;cursor:pointer}
.primary{background:#0b3d91;color:#fff} .secondary{background:#eef3fb;color:#0b3d91}
.hint{font-size:14px;color:#7a7974;margin-top:16px}
.note{font-size:15px;border-radius:10px;padding:10px 12px;margin:0 0 14px;background:#e9f6ee;color:#14532d}
.note.warn{background:#fdecea;color:#7f1d1d}
</style></head><body><div class="card">
<img src="logo.png" alt="InsightX">
<p>Your InsightX dashboard — sign in with the email you were invited with.</p>
<div id="note" class="note" hidden></div>
<button id="install" class="btn primary" hidden>Install InsightX</button>
<a id="open" class="btn secondary" href="https://dbl-insightx.streamlit.app/">Open InsightX</a>
<p class="hint" id="hint">To keep it on your phone: tap <b>⋮</b> → <b>Install app</b> (or <b>Add to Home screen</b>).</p>
</div>
<script>
const APP = "https://dbl-insightx.streamlit.app/";
const SLOT = "insightx_owner";
function box() { try { return window.localStorage; } catch (e) { return null; } }
let saved = null;
const m = location.hash.match(/^#owner=(.*)$/);
if (m) {
  const v = decodeURIComponent(m[1] || "").trim(), s = box();
  history.replaceState(null, "", location.pathname + location.search);   // the key never stays in the address bar
  if (!s) { saved = "fail"; }
  else if (v && v !== "off") { try { s.setItem(SLOT, v); saved = "on"; } catch (e) { saved = "fail"; } }
  else { s.removeItem(SLOT); saved = "off"; }
}
let key = null; try { key = box() && box().getItem(SLOT); } catch (e) {}
const TARGET = key ? APP + "?owner=" + encodeURIComponent(key) : APP;
if (window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone) { location.replace(TARGET); }
document.getElementById("open").href = TARGET;
const note = document.getElementById("note");
if (saved === "on") { note.textContent = "✅ Your full view is set on this phone. Now install InsightX (if it is already installed, just open it)."; note.hidden = false; }
else if (saved === "off") { note.textContent = "Full view removed from this phone — InsightX here now opens the shared view."; note.hidden = false; }
else if (saved === "fail") { note.textContent = "Couldn't save on this phone. Open this link in normal Chrome (not Incognito) and try again."; note.className = "note warn"; note.hidden = false; }
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js"); }
let ask = null; const btn = document.getElementById("install");
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); ask = e; btn.hidden = false; });
btn.addEventListener("click", async () => { if (!ask) return; ask.prompt(); await ask.userChoice; ask = null; btn.hidden = true; });
window.addEventListener("appinstalled", () => { document.getElementById("hint").textContent = "Installed — open InsightX from your home screen."; });
</script></body></html>
